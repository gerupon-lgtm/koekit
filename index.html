<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f6fb">
  <meta name="description" content="こえとタッチであそぶ、つくる。親子の小さな体験。">
  <title>コエキット</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./assets/icons/koekit-180.png">
  <link rel="icon" href="./assets/icons/koekit-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./sw-register.js"></script>

</head>
<body>
  <main class="page">
    <header class="site-header">
      <h1 class="site-title"><img class="brand-symbol" src="./assets/brand/koekit-symbol.webp" alt="" width="72" height="72"><span>コエキット</span></h1>
      <p class="site-lead">こえが、あそびになる。</p>
      <p class="site-note">話して、みつけて、つくってみよう。</p>
    </header>

    <ul class="app-list">
      <li>
        <a class="app-card" href="./doubutsu/"><div class="app-info">
          <div class="app-name"><img class="wordmark" src="./assets/brand/pitarhythm.svg" alt="ピタリズム" width="718" height="196"></div>
          <div class="app-desc">とめて、こたえて。だれがいるかな？</div>
          </div><span class="app-open" aria-hidden="true">▶</span>
        </a>
      </li>
      <li>
        <a class="app-card memory" href="./kioku/"><div class="app-info">
          <div class="app-name"><img class="wordmark" src="./assets/brand/memorhythm.svg" alt="メモリズム" width="718" height="196"></div>
          <div class="app-desc">よくみて、おぼえて。どこにいたかな？</div>
          </div><span class="app-open" aria-hidden="true">▶</span>
        </a>
      </li>
      <li>
        <a class="app-card art" href="./irodori/"><div class="app-info">
          <div class="app-name"><img class="wordmark" src="./assets/brand/irodorhythm.svg" alt="イロドリズム" width="838" height="196"></div>
          <div class="app-desc">いろをえらんで、じぶんだけのドットえ。</div>
          </div><span class="app-open" aria-hidden="true">▶</span>
        </a>
      </li>
    </ul>

    <p class="family-note">こえでも、タッチでも。<br>おうちのかたと、いっしょにどうぞ。</p>
    <footer class="site-footer">© 2026 SIKUMI LAB</footer>
  </main>
</body>
</html>
