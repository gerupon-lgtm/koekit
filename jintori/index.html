<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf5ed">
  <title>ジントリズム</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../assets/icons/koekit-192.png">
  <link rel="apple-touch-icon" href="../assets/icons/koekit-180.png">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="../sw-register.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
<main id="app">
  <header class="toolbar">
    <a id="home" class="icon" href="../" aria-label="コエキット トップへ"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M6 10v11h5v-7h3v7h4V10"/></svg></a>
    <button id="quit" class="icon" data-action="quit" aria-label="対戦を終了" hidden><svg viewBox="0 0 24 24"><path d="M10 4H4v16h6m0-8h11m-5-5 5 5-5 5"/></svg></button>
    <span class="toolbar-caption" id="toolbar-caption">こえで、じんとり。</span>
    <button class="icon" data-action="help" aria-label="遊び方"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 8a3 3 0 0 1 6 1c0 2-3 2-3 5m0 3v.1"/></svg></button>
    <span id="mic-state" class="mic-state" role="img" aria-label="音声受付は休止中"><svg class="mic" viewBox="0 0 24 24"><g class="body"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8" fill="none" stroke="currentColor" stroke-width="2"/></g><path class="slash" d="m3 3 18 18"/></svg></span>
  </header>
  <p id="save-status" class="save-status" role="status" hidden></p>
  <section id="title" class="screen">
    <h1><img class="wordmark" src="../assets/brand/jintorhythm.svg" alt="ジントリズム" width="838" height="196"></h1>
    <div id="menu-options" class="menu-options">
      <div class="seg" aria-label="対戦相手"><button data-option="opponent" data-value="cpu">コンピュータ</button><button data-option="opponent" data-value="human">ふたり</button></div>
      <div class="seg" id="structure-options" aria-label="対戦の遊び方"><button data-option="structure" data-value="series">局数をきめる</button><button data-option="structure" data-value="streak">連勝チャレンジ</button></div>
      <div id="series-options" class="option-pair">
        <div class="seg" aria-label="対戦回数"><button data-option="rounds" data-value="1">1局</button><button data-option="rounds" data-value="3">3局</button><button data-option="rounds" data-value="5">5局</button></div>
        <div class="seg" aria-label="盤面サイズ"><button data-option="size" data-value="4">4 × 4</button><button data-option="size" data-value="6">6 × 6</button><button data-option="size" data-value="8">8 × 8</button></div>
      </div>
      <div class="seg" aria-label="特殊色の持ち方"><button data-option="supplyPolicy" data-value="refill">毎局補充</button><button data-option="supplyPolicy" data-value="carry">持ち越し</button></div>
      <p id="mode-note" class="note"></p>
      <div class="difficulty" id="difficulty-options" aria-label="コンピュータの強さ"><button data-option="difficultyId" data-value="easy">やさしい</button><button data-option="difficultyId" data-value="normal">ふつう</button><button data-option="difficultyId" data-value="hard">むずかしい</button></div>
    </div>
    <div class="menu-actions"><button id="resume" class="big gold" data-action="resume" hidden>続きから</button><button id="new" class="big green" data-action="new">新しくはじめる</button></div>
    <p id="record" class="record"></p>
    <footer class="title-footer">v0.1.0 &nbsp; © 2026 SIKUMI LAB</footer>
  </section>
  <section id="setup" class="screen" hidden>
    <h2>じぶんの色をえらぼう</h2>
    <p id="color-turn" class="selection-status"></p>
    <div id="color-players" class="scores"></div>
    <div id="palette" class="palette"></div>
    <p class="note">「あお」「あか」でもえらべます。<br>えらばずスタートすると、白と黒。</p>
    <button class="big purple" id="color-confirm" data-action="confirmColor" aria-label="色をオッケー">色をオッケー</button>
    <button class="big gold" data-action="start">スタート</button>
  </section>
  <section id="dice" class="screen" hidden>
    <h2>どちらから はじめる？</h2>
    <p class="note">奇数はプレイヤー1、偶数はあいて。</p>
    <div id="dice-face" class="dice-face" aria-live="off">1</div>
    <p id="dice-result" class="selection-status" role="status">「ストップ」でとめよう</p>
    <button id="stop-dice" class="big gold" data-action="stop">ストップ</button>
  </section>
  <section id="game" class="screen" hidden>
    <div class="match-info"><span id="round-info"></span><span id="score-info"></span></div>
    <div id="scores" class="scores"></div>
    <div id="turn-status" class="turn-status" role="status"></div>
    <div id="board" class="board" aria-label="対戦盤面"></div>
    <div id="selection-status" class="selection-status" role="status"></div>
    <div id="direction-options" class="direction-options"></div>
    <div class="item-options"><button id="enhanced" class="item" data-item="enhanced">きょうか</button><button id="strongest" class="item" data-item="strongest">さいきょう</button></div>
    <div class="move-actions"><button class="big subtle" data-action="undo">もどす</button><button id="confirm-move" class="big gold" data-action="confirm" disabled>オッケー</button></div>
  </section>
  <section id="result" class="screen" hidden>
    <div class="result-mark" aria-hidden="true">◇</div>
    <h2 id="result-heading"></h2><p id="result-detail" class="result-detail"></p>
    <div id="result-scores" class="scores"></div><p id="result-record" class="record"></p>
    <button id="next-match" class="big green" data-action="next">つぎの対戦</button>
    <button id="extend" class="big gold" data-action="extend" hidden>延長して決着</button>
    <button id="end-result" class="big subtle" data-action="finish">終了する</button>
  </section>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div id="dialog-actions"></div></dialog>
</body>
</html>
