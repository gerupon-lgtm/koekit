<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>判定1-C改: Vosk 認識確認</title>
<style>
  body{font-family:system-ui,sans-serif;padding:1.2em;line-height:1.7;font-size:16px}
  button{font-size:1.1em;padding:.7em 1.1em;margin:.3em .3em .3em 0;min-height:52px}
  #big{font-size:2em;font-weight:700;color:#0a7a0a;min-height:1.4em;margin:.4em 0}
  #log{white-space:pre-wrap;background:#f2f2f2;padding:.8em;margin-top:1em;border-radius:6px;font-size:.95em}
  .ok{color:#0a7a0a;font-weight:700}.ng{color:#b00;font-weight:700}
  code{background:#eee;padding:.1em .3em}
</style>
</head>
<body>
<h1>判定1-C改: Vosk 認識確認</h1>
<p>音声処理を AudioWorklet で書き直した版です。<code>?model=&lt;URL&gt;</code> でモデルURLを指定します。</p>
<p>分離状態: <span id="coi"></span></p>

<button id="btnLoad">1. モデル読込</button>
<button id="btnRec" disabled>2. 認識開始</button>
<button id="btnStop" disabled>停止</button>

<div>認識結果 → <span id="big"></span></div>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.8/dist/vosk.js"></script>
<script>
const q = new URLSearchParams(location.search);
const logEl = document.getElementById('log');
const bigEl = document.getElementById('big');
const log = (m, cls) => { const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=m; logEl.appendChild(d); };
document.getElementById('coi').textContent = 'crossOriginIsolated=' + !!self.crossOriginIsolated;

const MODEL_URL = q.get('model') || './model/model.tar.gz';
let model=null, rec=null, ac=null, node=null, src=null, stream=null;

document.getElementById('btnLoad').onclick = async () => {
  log('--- モデル読込 ---');
  log('URL: ' + MODEL_URL);
  const t0 = performance.now();
  try {
    model = await Vosk.createModel(MODEL_URL);
    log('読込成功 ' + ((performance.now()-t0)/1000).toFixed(1) + '秒', 'ok');
    document.getElementById('btnRec').disabled = false;
  } catch (e) { log('読込失敗: ' + e.message, 'ng'); }
};

document.getElementById('btnRec').onclick = async () => {
  log('--- 認識開始 ---');
  try {
    // 認識器。語彙を絞ると精度が上がる（本番同様の使い方も試せる）
    const grammar = ['みぎ','ひだり','うえ','した','まんなか','ストップ','スタート','[unk]'];
    rec = new model.KaldiRecognizer(16000, JSON.stringify(grammar));
    rec.on('result',  (m) => { if(m.result.text){ bigEl.textContent = m.result.text; log('結果: 「'+m.result.text+'」','ok'); } });
    rec.on('partialresult', (m) => { if(m.result.partial) bigEl.textContent = '（'+m.result.partial+'）'; });

    stream = await navigator.mediaDevices.getUserMedia({ audio:{echoCancellation:true,noiseSuppression:true,channelCount:1}, video:false });
    log('マイク取得 OK','ok');

    ac = new AudioContext({ sampleRate: 16000 });
    if (ac.state === 'suspended') await ac.resume();       // モバイルで必要なことがある
    log('AudioContext sampleRate=' + ac.sampleRate);

    await ac.audioWorklet.addModule('./vosk-worklet.js');
    src = ac.createMediaStreamSource(stream);
    node = new AudioWorkletNode(ac, 'vosk-capture');

    // Worklet から届いた Float32(16k) を AudioBuffer にして Vosk へ
    node.port.onmessage = (ev) => {
      const data = ev.data;
      if (!data || !data.length) return;
      const buf = ac.createBuffer(1, data.length, 16000);
      buf.getChannelData(0).set(data);
      try { rec.acceptWaveform(buf); } catch(e){ log('acceptWaveform失敗: '+e.message,'ng'); }
    };

    src.connect(node);
    node.connect(ac.destination);     // 一部環境で process を回すために接続
    document.getElementById('btnStop').disabled = false;
    log('話してください（「みぎ」「ひだり」「ストップ」）…');
  } catch (e) { log('認識開始に失敗: ' + e.message, 'ng'); }
};

document.getElementById('btnStop').onclick = () => {
  try { node&&node.disconnect(); src&&src.disconnect(); stream&&stream.getTracks().forEach(t=>t.stop()); ac&&ac.close(); } catch(e){}
  log('停止しました');
  document.getElementById('btnStop').disabled = true;
};
</script>
</body>
</html>
