<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ea">
<title>ものがたり試作</title>
<script type="module" src="../../sw-register.js"></script>
<style>
  :root {
    --bg: #f7f3ea; --card: #fffdf8; --ink: #2f2a24; --sub: #7a7064; --line: #e4dccd;
    --accent: #e0703a; --accent-ink: #fff; --hl: #fff0c2; --ok: #2f8a4c; --ng: #c0392b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", system-ui, sans-serif; line-height: 1.7; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-size: 1.4rem; margin: 4px 0 2px; }
  .lead { color: var(--sub); margin: 0 0 16px; font-size: .9rem; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  .row > .lbl { width: 100%; font-size: .85rem; color: var(--sub); margin-bottom: -4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 8px 12px; white-space: nowrap; font: inherit; color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  input[type=text] { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; width: 10em; background: #fff; }
  button.btn { font: inherit; border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 14px; cursor: pointer; color: var(--ink); }
  button.main { display: block; width: 100%; background: var(--accent); color: var(--accent-ink); border: 0; font-size: 1.15rem; padding: 14px; border-radius: 14px; font-weight: bold; }
  .slots { font-size: .85rem; color: var(--sub); margin: 0 0 8px; }
  .slots b { color: var(--ink); font-weight: normal; background: #f1ebdf; border-radius: 6px; padding: 1px 6px; margin-right: 4px; }
  ol.story { list-style: none; padding: 0; margin: 0; }
  ol.story li { display: flex; gap: 8px; align-items: flex-start; padding: 10px 8px; border-radius: 10px; }
  ol.story li.reading { background: var(--hl); }
  .stage { flex: none; width: 5.4em; text-align: center; font-size: .7rem; color: var(--sub); border: 1px solid var(--line); border-radius: 999px; padding: 0 2px; margin-top: 5px; white-space: nowrap; }
  .text { flex: 1; cursor: pointer; }
  body.kids .text { font-size: 1.25rem; line-height: 1.9; }
  .reroll { flex: none; border: 0; background: transparent; font-size: 1.2rem; cursor: pointer; color: var(--sub); padding: 0 4px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .controls .btn { flex: 1; min-width: 7em; }
  .controls .play { background: var(--ink); color: #fff; border-color: var(--ink); }
  details > summary { cursor: pointer; font-weight: bold; }
  select { font: inherit; padding: 6px; border-radius: 8px; border: 1px solid var(--line); max-width: 100%; }
  input[type=range] { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: .8rem; margin-top: 8px; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px; text-align: left; vertical-align: top; }
  .yes { color: var(--ok); font-weight: bold; } .no { color: var(--ng); }
  pre.log { background: #2f2a24; color: #f7f3ea; font-size: .72rem; padding: 8px; border-radius: 8px; max-height: 220px; overflow: auto; white-space: pre-wrap; margin: 8px 0 0; }
  .status { font-size: .85rem; }
  .empty { color: var(--sub); text-align: center; padding: 18px 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: .85rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body class="kids">
<main>
  <h1>ものがたり（試作）</h1>
  <p class="lead">場面のパーツをランダムにつないで、おはなしをつくります。</p>

  <section class="panel">
    <div class="row"><span class="lbl">モード</span>
      <div class="seg" id="audience">
        <button data-v="kids" aria-pressed="true">こども</button>
        <button data-v="adult" aria-pressed="false">おとな</button>
      </div>
    </div>
    <div class="row"><span class="lbl">つながり</span>
      <div class="seg" id="level">
        <button data-v="shikkari" aria-pressed="true">しっかり</button>
        <button data-v="chotto" aria-pressed="false">ちょっとへん</button>
        <button data-v="mechakucha" aria-pressed="false">めちゃくちゃ</button>
      </div>
    </div>
    <div class="row"><span class="lbl">しゅじんこうの名前</span>
      <input type="text" id="name" maxlength="12" autocomplete="off">
      <button class="btn" id="randName" title="名前をランダムに">🎲</button>
    </div>
  </section>

  <button class="main" id="make">おはなしをつくる</button>

  <section class="panel" style="margin-top:14px">
    <p class="slots" id="slots"></p>
    <ol class="story" id="story"><li class="empty">「おはなしをつくる」をおしてね</li></ol>
    <div class="controls">
      <button class="btn play" id="play">▶ よみあげ</button>
      <button class="btn" id="stop">■ とめる</button>
      <button class="btn" id="copy">コピー</button>
    </div>
  </section>

  <details class="panel" id="ttsSettings">
    <summary>読み上げの設定</summary>
    <div class="row" style="margin-top:10px"><span class="lbl">声</span><select id="voice"></select></div>
    <div class="row"><span class="lbl">速さ <span id="rateV">1.0</span></span><input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1"></div>
    <div class="row"><span class="lbl">高さ <span id="pitchV">1.0</span></span><input type="range" id="pitch" min="0.5" max="1.8" step="0.1" value="1"></div>
  </details>

  <details class="panel" id="diag">
    <summary>オフライン読み上げの検証</summary>
    <p class="status" id="status"></p>
    <p class="status">手順：①オンラインで一度このページを開く（オフライン用に保存される）②機内モードにする ③ページを開き直して「よみあげ」→下の記録を確認</p>
    <table><thead><tr><th>声</th><th>言語</th><th>端末内</th></tr></thead><tbody id="voices"></tbody></table>
    <pre class="log" id="log"></pre>
    <div class="controls"><button class="btn" id="copyLog">記録をコピー</button><button class="btn" id="clearLog">記録を消す</button></div>
  </details>
</main>
<div class="toast" id="toast"></div>

<script type="module">
import { SETS } from './story-data.js';
import { generate, rerollPart, renderPart, stageLabel, splitSentences, LEVELS } from './story.js';

const $ = id => document.getElementById(id);
const state = { audience: 'kids', level: 'shikkari', story: null };

// ---------- 画面：設定 ----------
function bindSeg(el, key, onChange) {
  el.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state[key] = b.dataset.v;
    el.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    onChange?.();
  });
}
bindSeg($('audience'), 'audience', () => {
  document.body.classList.toggle('kids', state.audience === 'kids');
  randomName();
});
bindSeg($('level'), 'level');

function randomName() {
  const list = SETS[state.audience].names;
  $('name').value = list[Math.floor(Math.random() * list.length)];
}
$('randName').onclick = randomName;
randomName();

// ---------- 画面：物語 ----------
function renderStory() {
  const s = state.story;
  const ol = $('story');
  ol.innerHTML = '';
  if (!s) return;
  if (s.level === 'shikkari') {
    const f = s.fixed;
    $('slots').innerHTML = `<b>あいて</b>${esc(f.aite)}　<b>ばしょ</b>${esc(f.basho)}　<b>もの</b>${esc(f.mono)}`;
  } else {
    $('slots').textContent = `つながり：${LEVELS[s.level]}（場面ごとに、あいて・ばしょ・ものが変わります）`;
  }
  s.parts.forEach((p, i) => {
    const li = document.createElement('li');
    li.dataset.i = i;
    li.innerHTML = `<span class="stage">${stageLabel(p)}</span><span class="text">${esc(renderPart(s, p))}</span><button class="reroll" title="この場面だけ引き直す" aria-label="この場面だけ引き直す">↻</button>`;
    li.querySelector('.reroll').onclick = () => { stopSpeak(); state.story = rerollPart(state.story, i); renderStory(); };
    li.querySelector('.text').onclick = () => startSpeak(i);
    ol.appendChild(li);
  });
}
const esc = t => t.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

$('make').onclick = () => {
  stopSpeak();
  const name = $('name').value.trim() || SETS[state.audience].names[0];
  state.story = generate({ audience: state.audience, level: state.level, name });
  renderStory();
  log(`生成 mode=${state.audience} level=${state.level}`);
};

$('copy').onclick = async () => {
  if (!state.story) return;
  const text = state.story.parts.map(p => renderPart(state.story, p)).join('\n');
  try { await navigator.clipboard.writeText(text); toast('コピーしました'); } catch { toast('コピーできませんでした'); }
};

// ---------- 読み上げ（端末の音声合成 speechSynthesis） ----------
const synth = window.speechSynthesis;
let voices = [];
let queue = [];
let keep = [];      // 発話中のオブジェクトを保持（途中で止まる不具合の回避）
let speaking = false;

function loadVoices() {
  if (!synth) return;
  const all = synth.getVoices();
  voices = all.filter(v => /^ja/i.test(v.lang));
  const sel = $('voice');
  const prev = sel.value;
  sel.innerHTML = '';
  if (!voices.length) sel.innerHTML = '<option value="">（日本語の声が見つかりません・端末の既定）</option>';
  voices.forEach((v, i) => {
    const o = document.createElement('option');
    o.value = v.voiceURI;
    o.textContent = `${v.name}${v.localService ? '（端末内）' : '（ネット経由の可能性）'}`;
    sel.appendChild(o);
  });
  const best = voices.find(v => v.voiceURI === prev) || voices.find(v => v.localService) || voices[0];
  if (best) sel.value = best.voiceURI;
  $('voices').innerHTML = all.length
    ? voices.map(v => `<tr><td>${esc(v.name)}</td><td>${v.lang}</td><td class="${v.localService ? 'yes' : 'no'}">${v.localService ? 'はい' : 'いいえ'}</td></tr>`).join('')
      + `<tr><td colspan="3">全体 ${all.length} 件中、日本語 ${voices.length} 件</td></tr>`
    : '<tr><td colspan="3">声の一覧がまだ取得できていません</td></tr>';
}
if (synth) {
  loadVoices();
  synth.addEventListener?.('voiceschanged', () => { loadVoices(); log(`声の一覧を更新 日本語=${voices.length}`); });
  let tries = 0;
  const t = setInterval(() => { loadVoices(); if (voices.length || ++tries > 10) clearInterval(t); }, 500);
}

function startSpeak(from = 0) {
  if (!synth) { toast('この端末は読み上げに対応していません'); log('speechSynthesis なし'); return; }
  if (!state.story) return;
  stopSpeak();
  queue = [];
  state.story.parts.forEach((p, i) => {
    if (i < from) return;
    splitSentences(renderPart(state.story, p)).forEach(s => queue.push({ i, s }));
  });
  speaking = true;
  log(`読み上げ開始 online=${navigator.onLine} 文数=${queue.length}`);
  speakNext();
}

function speakNext() {
  if (!speaking) return;
  const item = queue.shift();
  if (!item) { speaking = false; highlight(-1); log('読み上げ完了'); return; }
  highlight(item.i);
  const u = new SpeechSynthesisUtterance(item.s);
  const v = voices.find(x => x.voiceURI === $('voice').value);
  if (v) u.voice = v;
  u.lang = 'ja-JP';
  u.rate = +$('rate').value;
  u.pitch = +$('pitch').value;
  const t0 = performance.now();
  let started = false;
  const guard = setTimeout(() => { if (!started && speaking) log(`⚠ 3秒たっても開始しない「${item.s.slice(0, 12)}…」`); }, 3000);
  u.onstart = () => { started = true; clearTimeout(guard); log(`開始 ${Math.round(performance.now() - t0)}ms 声=${v ? v.name : '既定'}`); };
  u.onend = () => { clearTimeout(guard); keep = keep.filter(x => x !== u); speakNext(); };
  u.onerror = e => {
    clearTimeout(guard); keep = keep.filter(x => x !== u);
    log(`✕ エラー ${e.error}`);
    if (e.error === 'interrupted' || e.error === 'canceled') return;
    speakNext();
  };
  keep.push(u);
  synth.speak(u);
}

function stopSpeak() {
  if (!synth) return;
  if (speaking) log('停止');
  speaking = false; queue = []; keep = [];
  synth.cancel();
  highlight(-1);
}
function highlight(i) {
  document.querySelectorAll('#story li').forEach(li => li.classList.toggle('reading', +li.dataset.i === i));
  const cur = document.querySelector('#story li.reading');
  cur?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
$('play').onclick = () => startSpeak(0);
$('stop').onclick = stopSpeak;
$('rate').oninput = () => ($('rateV').textContent = (+$('rate').value).toFixed(1));
$('pitch').oninput = () => ($('pitchV').textContent = (+$('pitch').value).toFixed(1));

// ---------- 検証用の記録 ----------
const lines = [];
function log(msg) {
  const d = new Date();
  const t = d.toTimeString().slice(0, 8);
  lines.push(`${t} ${msg}`);
  $('log').textContent = lines.join('\n');
  $('log').scrollTop = 1e9;
}
function updateStatus() {
  const sw = navigator.serviceWorker?.controller ? 'あり（オフライン用に保存済み）' : 'なし（一度オンラインで開き直すと有効）';
  $('status').innerHTML = `通信：<b class="${navigator.onLine ? 'yes' : 'no'}">${navigator.onLine ? 'オンライン' : 'オフライン'}</b>　保存の仕組み(SW)：${sw}<br>読み上げ機能：${synth ? 'あり' : 'なし'}`;
}
window.addEventListener('online', () => { updateStatus(); log('オンラインになった'); });
window.addEventListener('offline', () => { updateStatus(); log('オフラインになった'); });
navigator.serviceWorker?.addEventListener('controllerchange', updateStatus);
updateStatus();
log(`起動 UA=${navigator.userAgent}`);
$('copyLog').onclick = async () => {
  const v = voices.map(x => `${x.name}|${x.lang}|local=${x.localService}`).join('\n');
  try { await navigator.clipboard.writeText(`${lines.join('\n')}\n--- 日本語の声 ---\n${v}`); toast('記録をコピーしました'); } catch { toast('コピーできませんでした'); }
};
$('clearLog').onclick = () => { lines.length = 0; $('log').textContent = ''; };

let toastTimer;
function toast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1500); }
</script>
</body>
</html>
