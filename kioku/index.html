<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f6fb">
  <title>メモリズム</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../assets/icons/koekit-180.png">
  <link rel="icon" href="../assets/icons/koekit-192.png">
  <link rel="stylesheet" href="../styles.css">
  <script type="module" src="../sw-register.js"></script>
  <style>
    /* 共有UIコンポーネントは ../styles.css。ここはメモリズム固有のみ。 */
    html, body { min-height: 100%; overscroll-behavior: none; }


    /* 絵の仮置き：カードに大きな文字（A〜I） */
    .card-letter { font-family: var(--font-family); font-weight: 700; font-size: clamp(24px, 14vw, 96px);
      line-height: 1; color: var(--color-fg); }

    /* 記憶提示のカウントダウン数字（盤面の上に重ねる） */
    #countdown { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); pointer-events: none; }

    /* 探す絵（対象）の一瞬提示：大きな文字を中央に */
    #target-prompt { position: absolute; inset: 0; display: grid; place-items: center;
      background: rgba(255,255,255,.94); }
    #target-prompt .tp-letter { font-family: var(--font-family); font-weight: 700; font-size: 40vw; color: var(--color-fg); }
    #target-prompt .tp-letter img { width: min(60vw, 60vh, 340px); height: auto; }
  </style>
  <link rel="stylesheet" href="../src/ui/menu-controls.css">
  <script type="module" src="../src/ui/menu-help.js"></script>
<link rel="stylesheet" href="../src/ui/mic-toggle.css">
<script type="module" src="../src/ui/mic-toggle.js"></script>
</head>
<body class="play-app kioku">
  <!-- ============ S-02 タイトル ============ -->
  <section class="screen active" id="title" data-screen="title">
    <a class="icon-btn home menu-home" href="../" aria-label="コエキット トップへ">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-2.5v9h-5.5v-6h-2v6H5.5v-9H3z"/></svg>
    </a>
    <h1 class="app-title"><img class="wordmark" src="../assets/brand/memorhythm.svg" alt="メモリズム" width="718" height="196"></h1>
    <nav class="mode-picker" aria-label="遊び方"><a id="mode-place" href="./">場所</a><a id="mode-sequence" href="./?mode=sequence">順番</a></nav>
    <div class="level-picker"><div id="level-select"></div></div>
    <div id="highest-title" class="highest-title" aria-live="polite"></div>
    <footer class="title-footer">v0.1.0 &nbsp; © 2026 SIKUMI LAB</footer>
  </section>

  <!-- ============ S-04 ゲーム ============ -->
  <section class="screen" id="game" data-screen="game">
    <div class="topbar">
      <span id="level-status" class="level-status"></span>
      <button class="icon-btn quit-btn" id="to-title" aria-label="やめてタイトルへ（声でも「やめる」「おわり」）" title="やめる"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H4v16h6M9 12h12m-5-5 5 5-5 5"/></svg></button>
      <button type="button" class="mic-state" id="mic-state">
        <svg class="mic" viewBox="0 0 24 24">
          <g class="body">
            <rect x="9" y="2.5" width="6" height="11" rx="3"/>
            <path d="M6 11a6 6 0 0012 0" fill="none" stroke="#c9c9c9" stroke-width="1.6"/>
            <rect x="11.2" y="17" width="1.6" height="3.4"/>
            <rect x="8.5" y="20.2" width="7" height="1.6" rx=".8"/>
          </g>
          <line class="slash" x1="4" y1="4" x2="20" y2="20"/>
        </svg>
      </button>
      <svg class="finger" id="touch-hint" viewBox="0 0 24 24" fill="#888"><path d="M9 11V5a1.5 1.5 0 013 0v6h1V6.5a1.5 1.5 0 013 0V13a6 6 0 01-6 6h-1a5 5 0 01-4-2l-3-4 1.2-1.1a2 2 0 012.6-.1L9 13z"/></svg>
    </div>
    <div id="sequence-status" class="sequence-status" role="status"></div>
    <div id="stage">
      <div id="board"></div>
      <div id="figure">
        <svg viewBox="0 0 100 100">
          <path class="arrow" d="M50 6 L74 44 L58 44 L58 92 L42 92 L42 44 L26 44 Z"/>
          <circle class="dot" cx="50" cy="50" r="16" style="display:none"/>
        </svg>
      </div>
      <div id="countdown" class="hidden"></div>
      <div id="target-prompt" class="hidden"><div class="tp-letter"></div></div>
    </div>
    <div class="controls">
      <button class="icon-btn answer-edit hidden" id="undo-answer" aria-label="もどす：最後の1つを取り消す">↶</button>
      <button class="icon-btn answer-edit hidden" id="clear-answer" aria-label="やりなおし：こたえを全部けす">↺</button>
      <button class="btn-round confirm hidden" id="confirm-btn" aria-label="オーケー、カードをめくる">
        <svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.2 9 19l11-11-1.4-1.4z"/></svg>
      </button>
      <button class="btn-round hidden" id="next-btn" aria-label="スタート">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
  </section>

  <!-- ============ S-06 認定書 ============ -->
  <section class="screen" id="cert" data-screen="cert">
    <button class="icon-btn quit-btn" id="cert-quit" aria-label="やめてタイトルへ（声でも「やめる」「おわり」）" title="やめる"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H4v16h6M9 12h12m-5-5 5 5-5 5"/></svg></button>
    <div class="medal" id="medal">
      <svg id="medal-icon" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l3 6 6 .5-4.5 4 1.5 6-6-3.5L6 18.5 7.5 12.5 3 8.5 9 8z"/></svg>
    </div>
    <div id="cert-award" class="cert-award" role="status"></div>
    <div id="cert-stars"></div>
    <button type="button" class="mic-state navigation-mic" aria-label="音声受付状態"><svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><rect class="body" x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8" fill="none" stroke="currentColor" stroke-width="2"/><path class="slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2"/></svg></button>
    <button class="btn-round level-next" id="cert-next" aria-label="つぎへ（声でも「つぎ」）">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </section>

  <!-- レベル紹介（保護者向け・各レベルの最初に表示） -->
  <dialog id="level-intro" aria-labelledby="intro-heading" aria-describedby="intro-text">
    <div class="intro-card">
      <div class="intro-details">
      <div class="intro-top"><span class="intro-badge" id="intro-badge"></span><button class="intro-back" id="intro-back" aria-label="タイトルへ戻る">やめる</button></div>
      <h2 id="intro-heading" tabindex="-1" autofocus></h2>
      <p class="intro-text" id="intro-text"></p>
      <div id="intro-preview" class="intro-preview" aria-label="このレベルのばしょ"></div>
      <ol id="intro-steps" class="intro-steps"></ol>
      <div class="intro-family"><p id="intro-touch"></p></div>
      </div>
      <div class="intro-navigation"><button type="button" class="mic-state navigation-mic" aria-label="音声受付状態"><svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><rect class="body" x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8" fill="none" stroke="currentColor" stroke-width="2"/><path class="slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2"/></svg></button><button class="intro-start" id="intro-go" aria-label="はじめる（声でも「オーケー」「オッケー」）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4L19 6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div><p class="intro-voice-hint">「オーケー」「オッケー」で はじめる<br>「つぎ」ですすむ ／「やめる」でおわる</p>
    </div>
  </dialog>

  <script type="module" src="./entry.js"></script>
</body>
</html>
