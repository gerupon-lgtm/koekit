<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イロドリズム 上部コントロール案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">
<style>
  :root{ --bg:#faf5ed; --ink:#493f36; --muted:#9a8f80; --accent:#c9a84c;
         --green:#dce9d5; --green-ink:#30462e; --purple:#e7ddef; --purple-ink:#3d2f4a; --brown:#8a5a3c; --iro:#6f57c0; }
  *{box-sizing:border-box;}
  body{font-family:"M PLUS Rounded 1c",system-ui,sans-serif; margin:0; background:#e7ddc9; color:var(--ink); padding:16px;}
  .note{max-width:840px;margin:0 auto 14px;color:#5a4f40;font-size:14px;}
  .row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
  .phone{width:330px;background:var(--bg);border-radius:26px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.18);}
  .cap{text-align:center;font-size:13px;color:#5a4f40;margin:8px 0 0;}
  .hd{display:flex;justify-content:space-between;align-items:center;}
  .ico{width:50px;height:50px;border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.1);color:#8a7f70;}
  .ico.exit{color:var(--brown);}
  .ico.mic{border-radius:50%;background:#f2e2a8;color:#8a6d1f;}
  .ico svg{width:25px;height:25px;}
  .logo{text-align:center;font-weight:800;font-size:42px;letter-spacing:1px;margin:26px 0 22px;}
  .logo .a{color:var(--iro);} .logo .b{color:var(--brown);}
  .menu{display:flex;flex-direction:column;gap:12px;padding:0 4px;}
  .btn{font:inherit;font-weight:700;font-size:19px;border:0;border-radius:18px;padding:16px;min-height:60px;cursor:pointer;}
  .b-green{background:var(--green);color:var(--green-ink);}
  .b-purple{background:var(--purple);color:var(--purple-ink);}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:24px;}
  .board{margin:14px auto;width:250px;height:188px;background:#cbc2b0;border-radius:12px;display:grid;grid-template-columns:15px repeat(6,1fr) 15px;grid-template-rows:13px repeat(5,1fr) 13px;gap:2px;padding:3px;}
  .board .h{display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#8a7f70;}
  .board .c{background:#efe7d8;border-radius:3px;}
  .toolrow{display:flex;align-items:center;gap:8px;margin-top:6px;}
  .seg{display:flex;background:#e7ddc9;border-radius:14px;padding:3px;flex:1;}
  .seg button{flex:1;font:inherit;font-weight:700;font-size:14px;border:0;background:transparent;color:#7a6f5c;padding:9px 0;border-radius:11px;cursor:pointer;}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .save{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:14px;background:var(--accent);color:#332600;padding:11px 16px;min-height:46px;cursor:pointer;}
  .pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px;}
  .sw{aspect-ratio:1;border-radius:9px;border:2px solid rgba(0,0,0,.1);}
  svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<p class="note"><b>上部コントロールだけ</b>を既存2作品に合わせる案（配色はイロドリズムのまま・確認用モック・実アプリ未変更）。<b>タイトル＝左ホーム／右せってい（ギア）</b>、<b>制作＝左やめる（退出）／右マイク（音声の状態）</b>。ツール・パレット等は用途が違うので合わせません（並びだけ整理）。<b>よみあげは設定へ移動</b>。</p>
<div class="row">

  <div>
    <div class="phone">
      <div class="hd">
        <div class="ico" title="ホーム(コエキットへ)"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></div>
        <div class="ico" title="せってい(よみあげ等)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg></div>
      </div>
      <div class="logo"><span class="a">イロドリ</span><span class="b">ズム</span></div>
      <div class="menu">
        <button class="btn b-green">じゆうに つくる</button>
        <button class="btn b-green">おてほんを ぬる</button>
        <button class="btn b-purple">さくひん</button>
      </div>
      <p class="foot">v0.2.0　© 2026 SIKUMI LAB</p>
    </div>
    <p class="cap">① タイトル：左ホーム／右せってい（家族と同じ）</p>
  </div>

  <div>
    <div class="phone">
      <div class="hd">
        <div class="ico exit" title="やめる"><svg viewBox="0 0 24 24"><path d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8"/><path d="M11 12h9"/><path d="M17 9l3 3-3 3"/></svg></div>
        <div class="ico mic" title="マイク(音声の状態)"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v4"/></svg></div>
      </div>
      <div class="board">
        <div class="h"></div><div class="h">A</div><div class="h">B</div><div class="h">C</div><div class="h">D</div><div class="h">E</div><div class="h">F</div><div class="h"></div>
        <div class="h">1</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="h">1</div>
        <div class="h">2</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="h">2</div>
        <div class="h">3</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="h">3</div>
        <div class="h">4</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="h">4</div>
        <div class="h">5</div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="c"></div><div class="h">5</div>
        <div class="h"></div><div class="h">A</div><div class="h">B</div><div class="h">C</div><div class="h">D</div><div class="h">E</div><div class="h">F</div><div class="h"></div>
      </div>
      <div class="toolrow">
        <div class="seg"><button class="on">1マス</button><button>はんい</button><button>せん</button></div>
        <button class="save">ほぞん</button>
      </div>
      <div class="pal">
        <div class="sw" style="background:#E2413A"></div><div class="sw" style="background:#5CC4E6"></div><div class="sw" style="background:#F5D21F"></div><div class="sw" style="background:#8A5CC4"></div><div class="sw" style="background:#3FA34D"></div><div class="sw" style="background:#F29AC0"></div>
        <div class="sw" style="background:#2F6FD6"></div><div class="sw" style="background:#F08C2E"></div><div class="sw" style="background:#A8D24A"></div><div class="sw" style="background:#9C6B3F"></div><div class="sw" style="background:#FFFFFF"></div><div class="sw" style="background:#2B2B2B"></div>
      </div>
    </div>
    <p class="cap">② 制作：左やめる／右マイク（家族と同じ）。ツール・保存は用途別で整理のみ</p>
  </div>

</div>
</body>
</html>
