<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>イロドリズム</title>
<meta name="theme-color" content="#faf5ed">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../assets/icons/koekit-180.png">
<link rel="icon" href="../assets/icons/koekit-192.png">
<script type="module" src="../sw-register.js"></script>
<link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="../src/ui/menu-controls.css">
<link rel="stylesheet" href="../src/ui/mic-toggle.css">
<script type="module" src="../src/ui/mic-toggle.js"></script>
<link rel="stylesheet" href="../src/ui/voice-guide.css">
</head>
<body>
<main id="app">

  <!-- ① モード選択 -->
  <section class="screen" data-screen="mode">
    <header class="ir-hd">
      <button class="ir-icon menu-home" id="home-btn" aria-label="コエキットへ"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-2.5v9h-5.5v-6h-2v6H5.5v-9H3z"/></svg>
      </button>
      <button class="ir-icon ir-help-open menu-help" aria-label="つかいかた" title="つかいかた">？</button>
    </header>
    <h1 class="ir-logo"><img src="../assets/brand/irodorhythm.svg" alt="イロドリズム" width="838" height="196"></h1>
    <p class="ir-intro">こえと タッチで ドットえを つくろう。</p>
    <div class="ir-menu">
      <button class="ir-big ir-sub" data-go="tutorial">こえと タッチの れんしゅう <small>9 × 9で、4つの おためし</small></button>
      <button class="ir-big" data-go="template">おてほんを ぬる <small>かたちを えらんで、いろあそび</small></button>
      <button class="ir-big" data-go="free">じゆうに つくる</button>
      <button class="ir-big ir-sub" data-go="list">さくひん</button>
    </div>
    <p class="ir-foot"><span id="ver"></span>　© 2026 SIKUMI LAB</p>
  </section>

  <!-- ② 盤面サイズ選択 -->
  <section class="screen" data-screen="size" hidden>
    <header class="ir-hd">
      <button class="ir-icon" data-back="mode" aria-label="もどる">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="ir-icon ir-help-open menu-help" aria-label="つかいかた" title="つかいかた">？</button>
    </header>
    <p class="ir-intro">おおきさを えらんでね。はじめてなら 3 × 3。</p>
    <div class="ir-menu ir-sizes">
      <button class="ir-big" data-size="3">3 × 3</button>
      <button class="ir-big" data-size="5">5 × 5</button>
      <button class="ir-big" data-size="7">7 × 7</button>
      <button class="ir-big" data-size="9">9 × 9</button>
    </div>
  </section>

  <section class="screen" data-screen="templates" hidden>
    <header class="ir-hd"><button class="ir-icon" data-back="mode" aria-label="もどる">←</button><h2 class="ir-h2">おてほん</h2><button class="ir-icon ir-help-open menu-help" aria-label="つかいかた">？</button></header>
    <p class="ir-intro">すきな かたちを えらぼう。いろは かえても いいよ。</p>
    <button id="heart-practice" class="ir-heart-practice"><canvas id="heart-practice-picture" aria-hidden="true"></canvas><span><small>まずは ここから · 5 × 5</small><strong>はーとを つくろう</strong><span>5つの てじゅんで おてほんの れんしゅう →</span></span></button>
    <div id="template-sizes" class="ir-template-filters" aria-label="おおきさ"></div>
    <div id="template-categories" class="ir-template-filters" aria-label="しゅるい"></div>
    <div id="template-gallery" class="ir-template-gallery"></div>
    <p id="template-empty" class="ir-intro" hidden>この おおきさには まだ ないよ。ほかも みてね。</p>
  </section>

  <!-- ④ 制作 -->
  <section class="screen" data-screen="make" hidden>
    <header class="ir-hd">
      <button class="ir-icon ir-exit" data-back="mode" aria-label="やめる">
        <svg viewBox="0 0 24 24"><path d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8"/><path d="M11 12h9"/><path d="M17 9l3 3-3 3"/></svg>
      </button>
      <span id="tutorial-status" hidden></span>
      <button type="button" class="ir-micwrap mic-state" id="mic-state" aria-label="こえの じょうたい">
        <svg class="mic" viewBox="0 0 24 24" aria-hidden="true">
          <g class="body">
            <rect x="9" y="2.5" width="6" height="11" rx="3"/>
            <path d="M6 11a6 6 0 0 0 12 0" fill="none" stroke="#c9c9c9" stroke-width="1.6"/>
            <rect x="11.2" y="17" width="1.6" height="3.4"/>
            <rect x="8.5" y="20.2" width="7" height="1.6" rx=".8"/>
          </g>
          <line class="slash" x1="4" y1="4" x2="20" y2="20"/>
        </svg>
      </button>
      <button class="ir-icon ir-help-open menu-help" aria-label="つかいかた" title="つかいかた">？</button>
    </header>
    <p id="tutorial-goal" hidden></p>
    <button id="template-reference" hidden></button>
    <p class="ir-msg" id="make-msg" role="status"></p>
    <div class="ir-board" id="board"></div>
    <div id="make-voice-guide"></div>
    <button class="ir-confirm" id="btn-confirm" disabled>オーケー（きめる）</button>
    <div class="ir-toolrow">
      <div class="ir-seg" id="tools">
        <button class="ir-tool is-active" data-tool="single">1マス</button>
        <button class="ir-tool" data-tool="range">はんい</button>
        <button class="ir-tool" data-tool="line">せん</button>
      </div>
      <button class="ir-save" id="btn-save">ほぞん</button>
    </div>
    <div class="ir-palhead">
      <span class="ir-pl">いろ</span>
      <div class="ir-palctrls">
        <button class="ir-pc" id="btn-erase" aria-label="けす（むしょくに もどす）">
          <svg viewBox="0 0 24 24"><path d="M4 15l6-6 8 8-3 3H7z"/><path d="M9 20h11"/></svg><span>けす</span>
        </button>
        <button class="ir-pc" id="btn-undo" aria-label="もどす">
          <svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-1"/></svg>
        </button>
        <button class="ir-pc" id="btn-redo" aria-label="やりなおし">
          <svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h1"/></svg>
        </button>
        <button class="ir-ytoggle" id="btn-read" aria-pressed="false">よみあげ:オフ</button>
      </div>
    </div>
    <div class="ir-palette" id="palette"></div>
  </section>

  <!-- ⑤ 作品一覧 -->
  <section class="screen" data-screen="list" hidden>
    <header class="ir-hd">
      <button class="ir-icon" data-back="mode" aria-label="もどる">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="ir-icon ir-help-open menu-help" aria-label="つかいかた" title="つかいかた">？</button>
    </header>
    <h2 class="ir-h2">さくひん</h2>
    <p class="ir-empty-note" id="list-empty" hidden>まだ さくひんが ないよ。</p>
    <div class="ir-gallery" id="gallery"></div>
  </section>

  <!-- ⑥ 完成プレビュー -->
  <section class="screen" data-screen="preview" hidden>
    <header class="ir-hd">
      <button class="ir-icon" id="preview-back" aria-label="もどる">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="ir-icon ir-help-open menu-help" aria-label="つかいかた" title="つかいかた">？</button>
    </header>
    <div class="ir-preview-wrap"><canvas id="preview-canvas" class="ir-preview-canvas"></canvas></div>
  </section>

</main>
<dialog id="template-dialog" class="ir-help ir-template-dialog" aria-labelledby="template-title">
  <div class="ir-help-head"><h2 id="template-title"></h2><button id="template-close" class="ir-help-close" aria-label="とじる">×</button></div>
  <div id="recipe-tabs" class="ir-recipe-tabs" hidden><button id="recipe-overview" aria-pressed="true">おてほん</button><button id="recipe-open" aria-pressed="false">5てで つくる</button></div>
  <canvas id="template-canvas" class="ir-template-picture" role="img"></canvas>
  <p id="template-caption"></p>
  <div id="recipe-content" hidden><h3 id="recipe-title"></h3><div id="recipe-words" class="ir-tutorial-words"></div><p id="recipe-tip"></p><div class="ir-recipe-nav"><button id="recipe-prev" class="ir-mini">まえ</button><span id="recipe-progress"></span><button id="recipe-next" class="ir-mini">つぎ</button></div></div>
  <p id="template-freedom">おなじ いろでも、すきな いろでも。</p>
  <button id="template-guide-toggle" class="ir-mini" aria-pressed="true">したえ：オン</button>
  <div id="template-voice-guide"></div>
  <button id="template-done" class="ir-help-done">ぬる</button>
</dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
